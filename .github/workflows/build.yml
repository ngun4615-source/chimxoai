name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sap xep file
        run: |
          mkdir -p app/src/main/java/vn/chimxoai app/src/main/assets
          mv app_build.gradle app/build.gradle
          mv AndroidManifest.xml app/src/main/
          mv MainActivity.java BtBridge.java app/src/main/java/vn/chimxoai/
          mv index.html app/src/main/assets/
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: 8.5 }
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: ChimXoai-apk, path: app/build/outputs/apk/debug/app-debug.apk }
