<style>
  /* Layout: a Nokia-style handheld, 128x160 screen on top, 3x3 keypad below. */
  :root {
    --bg: #fbefd8;
    --ink: #4a2810;
    --ink-soft: #8a5a30;
    --shell: #f6e2bd;
    --key: #fff7e6;
    --key-edge: #e0b070;
    --key-ink: #4a2810;
    --accent: #f08a24;
    --screen-edge: #c98a3e;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1d1710; --ink: #f6e6c8; --ink-soft: #b99a70; --shell: #2b2117;
      --key: #3a2d1f; --key-edge: #1a130c; --key-ink: #f6e6c8; --accent: #f2a040; --screen-edge: #5a4026;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1d1710; --ink: #f6e6c8; --ink-soft: #b99a70; --shell: #2b2117;
    --key: #3a2d1f; --key-edge: #1a130c; --key-ink: #f6e6c8; --accent: #f2a040; --screen-edge: #5a4026;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 10px;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    touch-action: manipulation; overscroll-behavior: none;
  }
  #app { display: flex; flex-direction: column; align-items: center; gap: 12px; min-height: 100%; }
  .shell {
    background: var(--shell); border-radius: 28px 28px 36px 36px; padding: 12px 12px 14px;
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    width: min(100%, 420px); box-shadow: 0 1px 0 var(--key-edge);
  }
  .screen {
    width: min(100%, calc((100dvh - 262px) * 0.8)); min-width: 220px; aspect-ratio: 128 / 160;
    border: 3px solid var(--screen-edge); border-radius: 8px; overflow: hidden; background: #fff3dc;
  }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; max-width: 300px; }
  .k {
    appearance: none; -webkit-appearance: none; border: 0; border-radius: 14px; min-height: 46px;
    background: var(--key); color: var(--key-ink); font: 700 18px/1 inherit; font-family: inherit;
    box-shadow: 0 3px 0 var(--key-edge); display: grid; place-items: center; padding: 4px;
    -webkit-tap-highlight-color: transparent;
  }
  .k small { display: block; font-size: 10px; font-weight: 600; color: var(--ink-soft); margin-top: 2px; }
  .k:active, .k.on { transform: translateY(2px); box-shadow: 0 1px 0 var(--key-edge); }
  .k:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .ok { background: var(--accent); color: #3a1e0e; }
  .note { font-size: 12px; line-height: 1.45; color: var(--ink-soft); text-align: center; max-width: 330px; text-wrap: balance; }
  .ov { position: fixed; inset: 0; background: rgba(20,12,4,.55); display: grid; place-items: center; padding: 16px; z-index: 10; }
  .ov[hidden] { display: none; }
  .card { background: var(--shell); color: var(--ink); border-radius: 18px; padding: 16px; width: min(100%, 380px); display: flex; flex-direction: column; gap: 10px; max-height: 92dvh; overflow: auto; box-shadow: 0 8px 30px rgba(0,0,0,.35); }
  .card h2 { margin: 0; font-size: 16px; }
  .card p { margin: 0; font-size: 13px; line-height: 1.45; color: var(--ink-soft); }
  .card textarea { width: 100%; min-height: 84px; border-radius: 10px; border: 2px solid var(--key-edge); background: var(--key); color: var(--ink); font: 12px/1.3 ui-monospace, Menlo, monospace; padding: 8px; resize: vertical; user-select: text; -webkit-user-select: text; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn { appearance: none; border: 0; border-radius: 12px; padding: 11px 14px; min-height: 44px; font: 700 14px/1 inherit; font-family: inherit; background: var(--key); color: var(--key-ink); box-shadow: 0 3px 0 var(--key-edge); flex: 1; }
  .btn.pri { background: var(--accent); color: #3a1e0e; }
  .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--key-edge); }
  .card label { display:flex; flex-direction:column; gap:4px; font-size:13px; font-weight:600; }
  .card input { font: 600 16px/1.2 inherit; font-family: inherit; padding: 10px; border-radius: 10px; border: 2px solid var(--key-edge); background: var(--key); color: var(--ink); user-select: text; -webkit-user-select: text; }
  .st { font-size: 12px; color: var(--ink-soft); min-height: 16px; }
</style>

<main id="app">
  <div class="shell">
    <div class="screen"><canvas id="c" aria-label="M&#224;n h&#236;nh game nu&#244;i chim"></canvas></div>
    <div class="pad" id="pad">
      <button class="k" data-k="sl" type="button">&#9664;<small>Ch&#259;m s&#243;c</small></button>
      <button class="k" data-k="up" type="button" aria-label="L&#234;n">&#9650;</button>
      <button class="k" data-k="sr" type="button">&#9654;<small>Menu</small></button>
      <button class="k" data-k="left" type="button" aria-label="Tr&#225;i">&#9664;</button>
      <button class="k ok" data-k="ok" type="button">OK</button>
      <button class="k" data-k="right" type="button" aria-label="Ph&#7843;i">&#9654;</button>
      <button class="k" data-k="star" type="button">*<small>Ch&#259;m s&#243;c</small></button>
      <button class="k" data-k="down" type="button" aria-label="Xu&#7889;ng">&#9660;</button>
      <button class="k" data-k="pound" type="button">#<small>Menu</small></button>
    </div>
  </div>
  <p class="note">Ch&#7841;m v&#224;o m&#224;n h&#236;nh ho&#7863;c d&#249;ng ph&#237;m. Tr&#234;n iPhone: b&#7845;m Chia s&#7867;, ch&#7885;n &#8220;Th&#234;m v&#224;o MH ch&#237;nh&#8221; &#273;&#7875; m&#7903; nh&#432; m&#7897;t &#7913;ng d&#7909;ng. Game t&#7921; l&#432;u trong tr&#236;nh duy&#7879;t.</p>

// ---------------------------------------------------------------- input
function press(a) {
